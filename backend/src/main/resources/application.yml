spring:
  application:
    name: taskmanagement
  profiles:
    active: dev

task:
  trash:
    retention-days: 30
  archive:
    retention-days: 30

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/taskmanagement
    username: taskmanagement
    password: secret
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration,classpath:db/dev-seed

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
